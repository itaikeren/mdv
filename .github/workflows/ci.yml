name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests for the API's pure logic (anchor resolution, email masking, slugs,
      # API-key hashing). No database is touched — the Neon driver is lazy, so a dummy
      # DATABASE_URL is enough for the modules that build a client at import time.
      - name: Test
        run: pnpm test

      # Also typechecks the API (apps/api runs `tsc`), and proves the client bundle builds.
      # No Clerk/Neon credentials are needed: VITE_ vars are only read at runtime, and the
      # API is typechecked rather than executed.
      - name: Build
        run: pnpm build
