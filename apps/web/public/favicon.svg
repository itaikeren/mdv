<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mdv">
  <!--
    mdv brand mark: the lowercase "m" from Pixelify Sans, the same pixel typeface as
    the app's `mdv_` wordmark. This path is the font's own glyph outline (extracted
    from PixelifySans-Variable, unitsPerEm 1000) transformed into the 32x32 viewBox,
    so the asymmetric humps and pixel-corner ledges match the wordmark exactly.
    Filled with the --term-green token, theme-aware for light/dark browser tabs.
    oklch is the source of truth; the hex before it is a fallback for older engines.
  -->
  <style>
    .m { fill: #59d483; fill: oklch(0.78 0.16 152); }
    @media (prefers-color-scheme: light) {
      .m { fill: #11813c; fill: oklch(0.53 0.14 150); }
    }
  </style>
  <path class="m" d="M3.0 25.3 L3.0 6.7 L14.39 6.7 L14.39 10.37 L17.61 10.37 L17.61 6.7 L25.38 6.7 L25.38 10.37 L29.0 10.37 L29.0 25.3 L24.98 25.3 L24.98 10.73 L18.01 10.73 L18.01 25.3 L13.99 25.3 L13.99 10.73 L7.07 10.73 L7.07 25.3 Z" />
</svg>
